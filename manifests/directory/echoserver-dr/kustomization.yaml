apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 容灾 overlay:复用生产 echoserver 的 deployment 作为 base,生产改动会自动跟随
resources:
  - ../echoserver
# 容灾集群镜像覆盖:如需与生产不同,改 newName(换仓库)或 newTag(换版本)
images:
  - name: registry.cn-hangzhou.aliyuncs.com/haoshuwei24/echo-server
    newName: registry.cn-hangzhou.aliyuncs.com/haoshuwei24/echo-server
    newTag: v1.0
