apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 容灾 overlay:复用生产 echoserver 的 deployment 作为 base,生产改动(含 tag)自动跟随
resources:
  - ../../echoserver
# 只统一替换镜像仓库(newName),不设 newTag → tag 跟随 base(与生产保持一致)
images:
  - name: registry-cn-hangzhou.ack.aliyuncs.com/dev/echo-server
    newName: registry.cn-hangzhou.aliyuncs.com/haoshuwei24/echo-server  # TODO: 确认容灾集群使用的镜像仓库地址
