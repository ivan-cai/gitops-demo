# 容灾用独立 Application(纯增量):只把 echo-server 下发到容灾集群
# 说明:
# - 生产 Application 与 manifests/directory/echoserver/ 目录零改动
# - 工作负载 overlay 在 dr/echo-server/,本 Application 文件放在同步路径之外
# - 应用到 argocd 所在集群: kubectl apply -f 本文件
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echoserver-dr
  namespace: argocd
spec:
  project: "default"
  source:
    repoURL: https://github.com/ivan-cai/gitops-demo.git
    targetRevision: test0721
    path: manifests/directory/dr/echo-server
  destination:
    # TODO: 替换为容灾集群在 argocd 中已注册的 cluster name(argocd cluster list 查看)
    name: <DR_CLUSTER_NAME>
    # 与生产 echo-server 所在 namespace 保持一致
    namespace: test
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
